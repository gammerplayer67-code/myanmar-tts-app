name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]==0.80.5"
          pip install -r requirements.txt

      - name: Build APK
        run: |
          flet build apk --include-packages flet_audio --project "Myanmar TTS Studio" --description "Myanmar Multilingual TTS Studio Pro" --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: Myanmar-TTS-Studio-APK
          path: build/apk/*.apk
