name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flet & Dependencies
        run: |
          pip install --upgrade pip
          pip install flet==0.24.1 edge-tts

      - name: Build APK
        run: |
          flet build apk --project "Myanmar TTS Studio" --description "Myanmar Multilingual TTS Studio Pro"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Myanmar-TTS-Studio-APK
          path: build/apk/*.apk
